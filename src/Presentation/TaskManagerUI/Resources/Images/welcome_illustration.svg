<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="2"/>
  
  <!-- Person -->
  <ellipse cx="150" cy="200" rx="30" ry="40" fill="#fbbf24"/>
  <circle cx="150" cy="160" r="20" fill="#f59e0b"/>
  <circle cx="145" cy="155" r="2" fill="#000"/>
  <circle cx="155" cy="155" r="2" fill="#000"/>
  <path d="M 145 165 Q 150 170 155 165" stroke="#000" stroke-width="1" fill="none"/>
  
  <!-- Laptop -->
  <rect x="90" y="220" width="40" height="25" rx="3" fill="#6b7280"/>
  <rect x="92" y="222" width="36" height="18" fill="#1f2937"/>
  <rect x="108" y="245" width="8" height="3" fill="#6b7280"/>
  
  <!-- Clock -->
  <circle cx="80" cy="80" r="15" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="70" stroke="#6b7280" stroke-width="2"/>
  <line x1="80" y1="80" x2="85" y2="85" stroke="#6b7280" stroke-width="1"/>
  
  <!-- Documents -->
  <rect x="200" y="120" width="20" height="25" rx="2" fill="#ffffff" stroke="#6b7280"/>
  <rect x="205" y="115" width="20" height="25" rx="2" fill="#ffffff" stroke="#6b7280"/>
  <rect x="210" y="110" width="20" height="25" rx="2" fill="#ffffff" stroke="#6b7280"/>
  
  <!-- Floating dots -->
  <circle cx="70" cy="150" r="3" fill="#fbbf24"/>
  <circle cx="230" cy="180" r="4" fill="#3b82f6"/>
  <circle cx="250" cy="70" r="2" fill="#ef4444"/>
  <circle cx="50" cy="250" r="3" fill="#10b981"/>
  <circle cx="200" cy="50" r="2" fill="#8b5cf6"/>
  
  <!-- Calculator -->
  <rect x="220" y="200" width="25" height="30" rx="3" fill="#64748b"/>
  <rect x="222" y="202" width="21" height="12" fill="#1e293b"/>
  <circle cx="225" cy="220" r="1.5" fill="#ffffff"/>
  <circle cx="230" cy="220" r="1.5" fill="#ffffff"/>
  <circle cx="235" cy="220" r="1.5" fill="#ffffff"/>
  <circle cx="240" cy="220" r="1.5" fill="#ffffff"/>
</svg>
